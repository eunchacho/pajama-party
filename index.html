<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>텔레토비 잠옷 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@700&family=Jua&display=swap">
<style>
/* Layout: 휴대폰 세로 한 줄 컬럼. 손그림 갈색 선 + 파스텔 면, 텔레토비 동산 초원 위에 카드와 인형뽑기 기계 */
:root {
  --line: #4a2f27;
  --line-soft: #7d5c4f;
  --cream: #fffaf0;
  --butter: #fff1b8;
  --pink: #ff9fbf;
  --pink-deep: #f0628f;
  --red-hand: #e0463c;
  --sky: #bfe8ff;
  --mint: #c4f0d6;
  --lilac: #e2d0ff;
  --peach: #ffd8c2;
  --grass: #93dc78;
  --bora: #a67de3;
  --ddubi: #7fd062;
  --nana: #ffd84d;
  --bbo: #ff6f6f;
  --display: 'Bagel Fat One', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --body: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hand: 'Gaegu', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --shadow: 0 4px 0 var(--line);
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--grass);
  color: var(--line);
  font-family: var(--body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px dashed var(--line); outline-offset: 3px; }

/* ---------- 초원 배경 ---------- */
.meadow { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.meadow svg { width: 100%; height: 100%; display: block; }
.meadow .cloud1 { animation: drift 22s ease-in-out infinite alternate; }
.meadow .cloud2 { animation: drift 30s ease-in-out infinite alternate-reverse; }
@keyframes drift { to { transform: translateX(40px); } }

.app {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
  overflow-x: hidden;
}
.screen { position: relative; z-index: 1; }

/* ---------- 첫 화면 ---------- */
.hero { text-align: center; display: grid; gap: 6px; justify-items: center; padding-top: 8px; }
.handnote {
  margin: 0;
  font-family: var(--hand);
  font-size: 19px;
  line-height: 1.25;
  color: var(--red-hand);
  text-shadow: 0 0 6px rgba(255, 255, 255, .9), 0 0 2px #fff;
}
.logo { margin: 0; width: min(100%, 370px); }
.logo svg { width: 100%; height: auto; display: block; overflow: visible; }
.logo text { text-anchor: middle; font-family: 'Bagel Fat One', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; stroke-linejoin: round; stroke-linecap: round; }
.logo .big { font-size: 84px; }
.logo .small { font-size: 52px; }
.logo .o1 { fill: #b8136f; stroke: #b8136f; stroke-width: 19px; }
.logo .o2 { fill: #ff5aa8; stroke: #ff5aa8; stroke-width: 13px; }
.logo .f1 { fill: url(#lgB); }
.logo .y1 { fill: var(--line); stroke: var(--line); stroke-width: 9px; }
.logo .lt { animation: bob 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes bob { 50% { transform: translateY(-5px); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dday {
  margin: 0;
  font-family: var(--display);
  background: var(--pink);
  color: #fff;
  border: 2.5px solid var(--line);
  box-shadow: var(--shadow);
  padding: 3px 16px 5px;
  border-radius: 999px;
  font-size: 20px;
  letter-spacing: .03em;
  font-variant-numeric: tabular-nums;
  -webkit-text-stroke: 1px var(--line);
}

.land { position: relative; height: 112px; margin-top: 2px; }
.parade { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 2px; }
.parade svg { width: 74px; height: auto; animation: hop 1.5s ease-in-out infinite; animation-delay: calc(var(--i) * .18s); }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }

.who {
  background: var(--cream);
  border: 2.5px solid var(--line);
  border-radius: 28px;
  box-shadow: 0 5px 0 var(--line);
  padding: 18px 16px 18px;
  display: grid;
  gap: 14px;
  position: relative;
}
.who h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; text-align: center; color: var(--pink-deep); -webkit-text-stroke: 1px var(--line); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.name-btn {
  background: var(--bg, var(--sky));
  border: 2.5px solid var(--line);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 14px 8px 12px;
  display: grid;
  gap: 6px;
  justify-items: center;
  cursor: pointer;
  transform: rotate(var(--tilt, 0deg));
  transition: transform .12s, box-shadow .12s;
  min-height: 92px;
}
.name-btn:active { transform: translateY(3px) rotate(var(--tilt, 0deg)); box-shadow: 0 1px 0 var(--line); }
.name-btn .nm { font-family: var(--display); font-size: 30px; line-height: 1.1; color: #fff; -webkit-text-stroke: 1.5px var(--line); overflow-wrap: anywhere; }
.name-btn .st { font-family: var(--hand); font-size: 16px; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 0 11px; }
.name-btn.done .st { background: var(--line); color: var(--butter); }
.rule { margin: 0; font-family: var(--hand); font-size: 18px; line-height: 1.4; text-align: center; color: var(--line-soft); }

/* ---------- 뽑기 화면 ---------- */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 4px 16px; }
.chip-btn {
  background: var(--cream); border: 2.5px solid var(--line); border-radius: 999px; padding: 5px 14px;
  box-shadow: 0 3px 0 var(--line); cursor: pointer; font-size: 15px;
}
.chip-btn:disabled { opacity: .45; cursor: default; }
.turn {
  font-family: var(--display); font-size: 18px; background: var(--butter); color: var(--line);
  border: 2.5px solid var(--line); border-radius: 999px; padding: 3px 14px 5px;
  max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.machine {
  background: var(--pink);
  border: 2.5px solid var(--line);
  border-radius: 34px 34px 22px 22px;
  box-shadow: 0 6px 0 var(--line);
  padding: 12px;
  display: grid;
  gap: 12px;
  position: relative;
}
.machine.shake { animation: shake .45s linear; }
@keyframes shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-5px, 1px) rotate(-.6deg); }
  40% { transform: translate(5px, -1px) rotate(.6deg); }
  60% { transform: translate(-4px, 0) rotate(-.4deg); }
  80% { transform: translate(3px, 1px); }
}
.marquee {
  background: var(--butter);
  border: 2.5px solid var(--line);
  border-radius: 22px;
  text-align: center;
  padding: 8px 8px 9px;
  display: grid;
  gap: 4px;
}
.marquee b { font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.1; color: var(--pink-deep); -webkit-text-stroke: 1px var(--line); }
.marquee small { font-family: var(--hand); font-size: 15px; color: var(--line-soft); }
.bulbs { display: flex; justify-content: space-between; padding-inline: 4px; }
.bulbs i {
  width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); background: #fff;
  animation: bulb 1.2s steps(1) infinite;
}
.bulbs i:nth-child(even) { animation-delay: .6s; }
.machine.busy .bulbs i { animation-duration: .3s; }
.machine.busy .bulbs i:nth-child(even) { animation-delay: .15s; }
@keyframes bulb { 0% { background: var(--pink-deep); } 50% { background: #fff; } }

.glass {
  position: relative;
  height: 330px;
  border: 2.5px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(180deg, #d9f3ff 0%, #f1fbff 60%, #e3f8d6 100%);
}
.glass::after {
  content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
  background: linear-gradient(115deg, transparent 18%, rgba(255,255,255,.6) 19%, rgba(255,255,255,.6) 24%, transparent 25%, transparent 30%, rgba(255,255,255,.45) 31%, rgba(255,255,255,.45) 33%, transparent 34%);
}
.rail {
  position: absolute; top: 0; left: 0; right: 0; height: 14px; z-index: 5;
  background: var(--line-soft); border-bottom: 2.5px solid var(--line);
}
.claw {
  position: absolute; top: 8px; left: 50%; z-index: 4;
  transform: translateX(-50%); transform-origin: 50% 0;
  display: flex; flex-direction: column; align-items: center;
}
.trolley { width: 36px; height: 13px; background: var(--butter); border: 2.5px solid var(--line); border-radius: 6px; }
.cable { width: 3px; height: 26px; background: var(--line); }
.head { position: relative; width: 60px; height: 50px; }
.head .clawsvg { position: absolute; inset: 0; z-index: 2; overflow: visible; width: 60px; height: 50px; }
.pl, .pr { transition: transform .35s cubic-bezier(.3, 1.6, .6, 1); }
.pl { transform-origin: 24px 12px; }
.pr { transform-origin: 36px 12px; }
.head.open .pl { transform: rotate(24deg); }
.head.open .pr { transform: rotate(-24deg); }
.head .doll { z-index: 1; }

.chute {
  position: absolute; left: 0; bottom: 0; width: 24%; height: 108px; z-index: 2;
  background: repeating-linear-gradient(-45deg, var(--butter) 0 10px, #ffc94d 10px 20px);
  border-top: 2.5px solid var(--line); border-right: 2.5px solid var(--line);
  border-radius: 0 16px 0 0;
  display: grid; place-items: center;
}
.chute span { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px 3px; font-family: var(--display); font-size: 15px; }
.doll { position: absolute; width: 66px; z-index: 3; }
.doll svg { width: 100%; height: auto; display: block; }
.ball { position: absolute; border-radius: 50%; border: 2px solid var(--line); z-index: 1; }

.panel {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  background: var(--lilac); border: 2.5px solid var(--line); border-radius: 22px; padding: 12px 12px 14px 16px;
}
.msg { font-family: var(--display); font-size: 20px; line-height: 1.3; min-height: 2.6em; display: flex; align-items: center; min-width: 0; color: var(--line); }
.msg.pulse { animation: thump .5s ease-in-out infinite; }
@keyframes thump { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.big-btn {
  width: 96px; height: 96px; border-radius: 50%;
  border: 2.5px solid var(--line);
  background: radial-gradient(circle at 35% 30%, #ffd0e0, var(--pink) 50%, var(--pink-deep));
  box-shadow: 0 7px 0 var(--line);
  font-family: var(--display); font-size: 26px; color: #fff;
  -webkit-text-stroke: 1.2px var(--line);
  cursor: pointer;
  animation: invite 1.4s ease-in-out infinite;
}
.big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
.big-btn:disabled { animation: none; filter: saturate(.4) brightness(.95); cursor: default; transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
@keyframes invite { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-7deg); } 20% { transform: rotate(7deg); } 30% { transform: rotate(0); } }
.fine { margin: 16px 0 0; text-align: center; font-family: var(--hand); font-size: 18px; color: var(--line); line-height: 1.35; background: var(--cream); border: 2.5px solid var(--line); border-radius: 18px; padding: 8px 12px; }

/* ---------- 결과 화면 ---------- */
.rays {
  position: fixed; inset: -60%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, var(--c2, #fff) 0 10deg, var(--butter) 10deg 20deg);
  animation: spin 40s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#reveal { display: grid; justify-items: center; gap: 16px; padding-top: 10px; }
#reveal > * { position: relative; z-index: 1; }
.tada {
  margin: 4px 0 -4px;
  font-family: var(--display); font-size: 72px; line-height: 1; color: var(--pink);
  -webkit-text-stroke: 2px var(--line); text-shadow: 0 5px 0 var(--line);
  transform: rotate(-6deg);
  animation: pop .6s cubic-bezier(.2, 1.8, .4, 1) both;
}
@keyframes pop { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
.polaroid {
  width: 100%;
  background: var(--cream);
  border: 2.5px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 6px 0 var(--line);
  padding: 14px 14px 20px;
  display: grid; gap: 6px; justify-items: center; text-align: center;
  transform: rotate(2deg);
  animation: slidein .7s .15s cubic-bezier(.2, 1.5, .4, 1) both;
}
@keyframes slidein { from { transform: translateY(60px) rotate(-10deg) scale(.8); opacity: 0; } to { transform: rotate(2deg); opacity: 1; } }
.photo {
  width: 100%; max-width: 100%; aspect-ratio: 1 / 1;
  border: 2.5px solid var(--line); border-radius: 10px;
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, #aee3ff 0%, #e2f6ff 62%);
}
.photo .hill { position: absolute; left: 0; bottom: 0; width: 100%; height: 38%; }
.photo .psun { position: absolute; left: 18px; top: 18px; width: 52px; height: 52px; border-radius: 50%; background: var(--nana); border: 2.5px solid var(--line); box-shadow: 0 0 0 8px rgba(255, 216, 77, .45); }
.photo .big-doll { position: absolute; left: 50%; bottom: 8%; width: 64%; transform: translateX(-50%); animation: land 1s .45s cubic-bezier(.25, 1.6, .5, 1) both; }
.photo .big-doll svg { width: 100%; height: auto; display: block; }
@keyframes land { from { transform: translate(-50%, -140%) scale(.6); } to { transform: translate(-50%, 0) scale(1); } }
.stamp {
  position: absolute; right: 12px; top: 14px;
  border: 2.5px solid var(--red-hand); color: var(--red-hand); background: rgba(255, 255, 255, .85);
  border-radius: 999px; padding: 2px 12px 4px; font-family: var(--display); font-size: 16px;
  transform: rotate(12deg);
  animation: stampin .35s 1.3s cubic-bezier(.3, 1.8, .5, 1) both;
}
@keyframes stampin { from { transform: rotate(12deg) scale(2.4); opacity: 0; } to { transform: rotate(12deg) scale(1); opacity: 1; } }
.cap { margin: 8px 0 0; font-family: var(--hand); font-size: 22px; color: var(--red-hand); }
.char-name {
  margin: 0; font-family: var(--display); font-weight: 400; font-size: 66px; line-height: 1.05;
  color: var(--c, var(--pink)); -webkit-text-stroke: 2px var(--line); text-shadow: 0 4px 0 var(--line);
}
.pj { margin: 4px 0 0; font-size: 18px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--line); background: var(--c, var(--pink)); display: inline-block; }
.note {
  margin: 0; background: var(--cream); border: 2.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  padding: 10px 14px; text-align: center; font-size: 16px; line-height: 1.5; width: 100%;
}
.note b { font-family: var(--display); font-weight: 400; color: var(--pink-deep); }
.cta {
  background: var(--butter); border: 2.5px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  padding: 10px 26px 12px; font-family: var(--display); font-size: 20px; cursor: pointer;
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

.flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 50; }
.flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<div class="meadow" aria-hidden="true">
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9fdcff"/><stop offset=".5" stop-color="#e2f6ff"/>
      </linearGradient>
      <filter id="hand" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G" result="d"/><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8" result="g"/><feColorMatrix in="g" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 -0.9 0.34" result="ga"/><feComposite in="ga" in2="d" operator="in" result="gi"/><feMerge><feMergeNode in="d"/><feMergeNode in="gi"/></feMerge></filter>
      <filter id="blush" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <path id="cloud" d="M30 200 q-20 0 -18 -18 q2 -16 20 -14 q6 -22 32 -20 q22 2 26 22 q18 -2 20 14 q2 16 -16 16 z"/>
    </defs>
    <rect width="400" height="800" fill="url(#skyg)"/>
    <g stroke="#4a2f27" stroke-width="2.5" stroke-linecap="round">
      <path d="M362 22 V10 M362 122 V134 M312 72 H300 M300 72 H300 M327 37 L319 29 M327 107 L319 115"/>
    </g>
    <circle cx="362" cy="72" r="34" fill="#ffd84d" stroke="#4a2f27" stroke-width="2.5"/>
    <g class="cloud1"><use href="#cloud" fill="#fff" stroke="#4a2f27" stroke-width="2.5"/></g>
    <g class="cloud2"><use href="#cloud" transform="translate(190 90) scale(.8)" fill="#fff" stroke="#4a2f27" stroke-width="3"/></g>
    <path d="M-10 450 Q90 380 190 420 T410 400 V810 H-10Z" fill="#c6efa6" stroke="#4a2f27" stroke-width="2.5"/>
    <path d="M-10 545 Q130 465 250 525 T410 505 V810 H-10Z" fill="#a8e48a" stroke="#4a2f27" stroke-width="2.5"/>
    <path d="M-10 655 Q110 595 220 645 T410 625 V810 H-10Z" fill="#8ad770" stroke="#4a2f27" stroke-width="2.5"/>
    <g id="meadowDeco"></g>
  </svg>
</div>

<div class="app">
  <!-- 첫 화면: 이름 선택 -->
  <section id="home" class="screen">
    <header class="hero">
      <p class="handnote">11월 29일 일요일,<br>포트럭 파자마 파티에서 만나!</p>

  })();

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = reduce ? 0.3 : 1;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms * T));
  const $ = (id) => document.getElementById(id);

  // ---------- 저장(이 기기에서 뽑은 기록) ----------
  const KEY = 'tubby-pj-drawn-v1';
  function readDrawn() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
  function markDrawn(slot) { try { const d = readDrawn(); d[slot] = 1; localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }

  // ---------- 캐릭터: 텔레토비 후드 잠옷을 입은 아이 (가는 갈색 선 · 수채 색연필 질감 · 번지는 볼터치) ----------
  const L = '#6b4636';
  const EYE = '#3a2620';
  const ANT = {
    tri: 'M50 17 V11.5 M50 1.8 L42.5 11.5 H57.5 Z',
    line: 'M50 17 V2.5',
    curl: 'M50 17 C50 12 45.5 11.5 45.5 7.5 C45.5 3.5 54 3 54 7.5 C54 10.5 50.6 10.5 50 8.6',
    ring: 'M50 17 V12 M45 7 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0',
  };
  const BANGS = 'M23.5 61 C22 43 34 33.5 50 33.5 C66 33.5 78 43 76.5 61 C75 56.5 73 53 71 51 C69 53.5 66 54.2 64 52.6 C61 54.6 57.5 54.6 55.2 52.6 C52.5 54.9 47.5 54.9 44.8 52.6 C42.5 54.6 39 54.6 36 52.6 C34 54.2 31 53.5 29 51 C27 53 25 56.5 23.5 61 Z';
  const STRANDS = 'M39 37.5 Q37.4 44.5 36.6 51.5 M50 35.5 Q50.4 44 50 53 M61 37.5 Q62.6 44.5 63.4 51.5 M44.5 36 Q43.5 44 44.5 52 M55.5 36 Q56.5 44 55.5 52';
  function eye(cx, cy) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="3.9" ry="4.5" fill="${EYE}"/>` +
      `<ellipse cx="${cx}" cy="${cy + 1.4}" rx="2.3" ry="1.9" fill="#80543f" opacity=".9"/>` +
      `<circle cx="${cx + 1.1}" cy="${cy - 1.6}" r="1.35" fill="#fff"/><circle cx="${cx - 1.3}" cy="${cy + 2}" r=".6" fill="#fff" opacity=".8"/>`;
  }
  const OPEN_EYES = eye(40.5, 64) + eye(59.5, 64);
  const FACE = {
    calm: OPEN_EYES + `<path d="M48 71.3 Q50 72.3 52 71.3" fill="none" stroke="${L}" stroke-width="1.3" stroke-linecap="round"/>`,
    oh: OPEN_EYES + `<ellipse cx="50" cy="71.6" rx="1.6" ry="1.9" fill="#c9605a" stroke="${L}" stroke-width="1"/>`,
    happy: `<path d="M36.5 63.6 Q40.5 67.6 44.5 63.6 M55.5 63.6 Q59.5 67.6 63.5 63.6" fill="none" stroke="${EYE}" stroke-width="1.7" stroke-linecap="round"/>` +
      `<path d="M47 70.4 Q50 74.6 53 70.4 Z" fill="#d9665e" stroke="${L}" stroke-width="1.1" stroke-linejoin="round"/>`,
    smile: OPEN_EYES + `<path d="M47.6 70.8 Q50 73.1 52.4 70.8" fill="none" stroke="${L}" stroke-width="1.3" stroke-linecap="round"/>`,
  };
  function dollSVG(c) {
    const a = ANT[c.ant];
    const o = `stroke="${L}" stroke-width="1.6" stroke-linejoin="round"`;
    return `<svg viewBox="0 0 100 114" aria-hidden="true"><g filter="url(#hand)">
      <path d="${a}" fill="none" stroke="${L}" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${a}" fill="none" stroke="${c.color}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="39" cy="107.5" rx="8" ry="4.3" fill="${c.color}" ${o}/>
      <ellipse cx="61" cy="107.5" rx="8" ry="4.3" fill="${c.color}" ${o}/>
      <path d="M30 88 C22 90 20 98 26 100.5 C29 101.5 31.5 98.5 32.5 95" fill="${c.color}" ${o}/>
      <path d="M70 88 C78 90 80 98 74 100.5 C71 101.5 68.5 98.5 67.5 95" fill="${c.color}" ${o}/>
      <path d="M29.5 82 C26.5 96 28.5 106 36.5 106 H63.5 C71.5 106 73.5 96 70.5 82 Z" fill="${c.color}" ${o}/>
      <rect x="43" y="94.5" width="14" height="9" rx="3" fill="#ebe6dc" stroke="${L}" stroke-width="1.4"/>
      <path d="M50 15 C73 14 91 31 91 55 C91 78 73 93 50 93 C27 93 9 79 9 55 C9 32 26 15 50 15 Z" fill="${c.color}" ${o}/>
      <path d="M19 42 Q24 29 35 23" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".55"/>
      <ellipse cx="50" cy="59.5" rx="29.5" ry="27" fill="#3a2010" opacity=".09"/>
      <path d="M50 33 C66 33 77 44 77 60 C77 75 65 84 50 84 C35 84 23 75 23 60 C23 44 34 33 50 33 Z" fill="#fde5d6" stroke="${L}" stroke-width="1.4"/>
      <ellipse cx="35" cy="68" rx="6.4" ry="4.2" fill="#f2807f" opacity=".5" filter="url(#blush)"/>
      <ellipse cx="65" cy="68" rx="6.4" ry="4.2" fill="#f2807f" opacity=".5" filter="url(#blush)"/>
      <ellipse cx="50" cy="66.6" rx="3.2" ry="2.2" fill="#f2807f" opacity=".32" filter="url(#blush)"/>
      <path d="${BANGS}" fill="${c.hair}" stroke="${L}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="${STRANDS}" fill="none" stroke="#2a1810" stroke-width=".8" stroke-linecap="round" opacity=".18"/>
      <path d="M49.2 66.6 Q50 67.5 50.8 66.6" fill="none" stroke="#c77a6a" stroke-width="1" stroke-linecap="round"/>
      ${FACE[c.face]}
    </g></svg>`;
  }

  // ---------- 첫 화면 ----------
  $('parade').innerHTML = [0, 1, 2, 3].map((ci, i) => dollSVG(CHARS[ci]).replace('<svg ', `<svg style="--i:${i}" `)).join('');

  function ddayText() {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const d = Math.round((PARTY - t) / 864e5);
    return d > 0 ? `D-${d}` : d === 0 ? 'D-DAY' : '파티 끝!';
  }
  $('dday').textContent = ddayText();

  // 초원에 꽃과 풀을 흩뿌린다 (매번 같은 자리)
  (() => {
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const petals = ['#ffffff', '#ffffff', '#ffc2d6', '#fff1b8', '#e2d0ff'];
    let out = '';
    for (let i = 0; i < 46; i++) {
      const x = 8 + rnd() * 384, y = 490 + rnd() * 300, s = 0.7 + rnd() * 0.6;
      if (rnd() < 0.45) {
        out += `<path d="M${x} ${y} l2.5 -8 l2.5 8 l2.5 -6 l2.5 6" fill="none" stroke="#4a8a3a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      } else {
        const p = petals[Math.floor(rnd() * petals.length)];
        out += `<g transform="translate(${x} ${y}) scale(${s})" stroke="#4a2f27" stroke-width="1.3">` +
          [0, 72, 144, 216, 288].map((a) => `<circle cx="${(Math.cos(a * Math.PI / 180) * 5).toFixed(1)}" cy="${(Math.sin(a * Math.PI / 180) * 5).toFixed(1)}" r="3.6" fill="${p}"/>`).join('') +
          `<circle r="2.8" fill="#ffb627"/></g>`;
      }
    }
    $('meadowDeco').innerHTML = out;
  })();

  const BTN_BG = ['var(--sky)', 'var(--mint)', 'var(--peach)', 'var(--lilac)'];
  const BTN_TILT = ['-2deg', '1.5deg', '2deg', '-1.5deg'];
  function renderNames() {
    const drawn = readDrawn();
    const box = $('names');
    box.innerHTML = '';
    NAMES.forEach((n, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = 'name-' + i;
      b.className = 'name-btn' + (drawn[i] ? ' done' : '');
      b.style.setProperty('--bg', BTN_BG[i]);
      b.style.setProperty('--tilt', BTN_TILT[i]);
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = n;
      const st = document.createElement('span'); st.className = 'st'; st.textContent = drawn[i] ? '결과 보기' : '뽑기 전';
      b.append(nm, st);
      b.addEventListener('click', () => (drawn[i] ? showReveal(i, true) : showPlay(i)));
      box.appendChild(b);
    });
  }

  function show(id) {
    ['home', 'play', 'reveal'].forEach((s) => { $(s).hidden = s !== id; });
    window.scrollTo(0, 0);
  }

  // ---------- 뽑기 기계 ----------
  const DOLL_X = [35, 53, 71, 89];
  const DOLL_B = [20, 38, 14, 30];
  const DOLL_R = [-7, 5, -4, 8];
  const CHUTE_X = 12;
  const BASE_CABLE = 26;
  const BALLS = [
    [26, 4, 30, '#ffc2d6'], [44, 0, 34, '#bfe8ff'], [60, 2, 28, '#fff1b8'], [78, 0, 32, '#c4f0d6'], [94, 6, 26, '#e2d0ff'],
    [34, 16, 22, '#fff1b8'], [66, 20, 24, '#ffc2d6'], [86, 22, 22, '#bfe8ff'],
  ];
  let slot = -1;
  let busy = false;
  let clawX = 50;

  function buildMachine() {
    const order = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    const floor = $('floor');
    floor.innerHTML = BALLS.map(([x, b, s, c]) =>
      `<span class="ball" style="left:calc(${x}% - ${s / 2}px);bottom:${b}px;width:${s}px;height:${s}px;background:${c}"></span>`).join('');
    order.forEach((ci, p) => {
      const d = document.createElement('div');
      d.className = 'doll';
      d.dataset.char = ci;
      d.dataset.x = DOLL_X[p];
      d.dataset.r = DOLL_R[p];
      d.style.left = `calc(${DOLL_X[p]}% - 33px)`;
      d.style.bottom = DOLL_B[p] + 'px';
      d.style.transform = `rotate(${DOLL_R[p]}deg)`;
      d.innerHTML = dollSVG(CHARS[ci]);
      floor.appendChild(d);
    });
    const claw = $('claw');
    claw.getAnimations().forEach((a) => a.cancel());
    claw.style.transition = 'none';
    claw.style.left = '50%';
    clawX = 50;
    const cable = $('cable');
    cable.style.transition = 'none';
    cable.style.height = BASE_CABLE + 'px';
    $('head').className = 'head';
    $('head').querySelectorAll('.doll').forEach((d) => d.remove());
    $('msg').textContent = '버튼을 누르면 집게가 출발해요';
    $('msg').classList.remove('pulse');
    $('machine').classList.remove('busy', 'shake');
    $('grabBtn').disabled = false;
    $('backBtn').disabled = false;
  }

  function say(t, pulse) {
    const m = $('msg');
    m.textContent = t;
    m.classList.toggle('pulse', !!pulse);
  }
  function moveTo(x, ms) {
    const claw = $('claw');
    claw.style.transition = `left ${ms * T}ms cubic-bezier(.45,.05,.35,1)`;
    claw.style.left = x + '%';
    clawX = x;
    return sleep(ms);
  }
  function setCable(px, ms) {
    const c = $('cable');
    c.style.transition = `height ${ms * T}ms cubic-bezier(.5,0,.5,1)`;
    c.style.height = px + 'px';
    return sleep(ms);
  }
  function shake() {
    const m = $('machine');
    m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake');
  }
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  async function play() {
    if (busy || slot < 0) return;
    busy = true;
    $('grabBtn').disabled = true;
    $('backBtn').disabled = true;
    $('machine').classList.add('busy');

    const ci = ASSIGN[slot];
    const doll = $('floor').querySelector(`.doll[data-char="${ci}"]`);
    const tx = parseFloat(doll.dataset.x);
    const others = DOLL_X.filter((x) => x !== tx);

    say('집게 출발!');
    await moveTo(pick([28, 46, 64]), 700);
    say('어디로 갈까...');
    await moveTo(pick(others.filter((x) => x !== clawX)), 900);
    await sleep(250);
    say('두근두근', true);
    await moveTo(pick(others.filter((x) => x !== clawX)), 650);
    await sleep(300);
    const near = others.slice().sort((a, b) => Math.abs(a - tx) - Math.abs(b - tx))[0];
    if (near !== clawX) await moveTo(near, 800);
    say('여기...?', true);
    await sleep(800);
    say('아니, 여기다!');
    await moveTo(tx, 450);
    await sleep(350);

    $('head').classList.add('open');
    await sleep(300);
    say('내려간다...', true);
    const gr = $('glass').getBoundingClientRect();
    const dr0 = doll.getBoundingClientRect();
    const len = Math.max(BASE_CABLE + 10, dr0.top - gr.top - 16);
    await setCable(len, 1100);
    await sleep(250);
    $('head').classList.remove('open');
    await sleep(420);

    // 집은 인형을 집게에 붙인다
    const head = $('head');
    const hr = head.getBoundingClientRect();
    const dr = doll.getBoundingClientRect();
    doll.style.bottom = 'auto';
    doll.style.left = (dr.left - hr.left) + 'px';
    doll.style.top = (dr.top - hr.top) + 'px';
    head.prepend(doll);

    say('잡았다?!', true);
    await setCable(BASE_CABLE, 1200);

    say('으악 흔들린다!!', true);
    shake();
    const claw = $('claw');
    await claw.animate([
      { transform: 'translateX(-50%) rotate(0deg)' },
      { transform: 'translateX(-50%) rotate(8deg)' },
      { transform: 'translateX(-50%) rotate(-7deg)' },
      { transform: 'translateX(-50%) rotate(5deg)' },
      { transform: 'translateX(-50%) rotate(-3deg)' },
      { transform: 'translateX(-50%) rotate(0deg)' },
    ], { duration: 1000 * T, easing: 'ease-in-out' }).finished;
    say('제발 제발 제발', true);
    await sleep(500);

    const r = parseFloat(doll.dataset.r) || 0;
    const travel = moveTo(CHUTE_X, 1700);
    await sleep(650);
    say('앗!!', true);
    shake();
    const slip = doll.animate([
      { transform: `rotate(${r}deg) translateY(0)` },
      { transform: `rotate(${r + 10}deg) translateY(16px)` },
      { transform: `rotate(${r + 6}deg) translateY(10px)` },
    ], { duration: 380 * T, easing: 'ease-out', fill: 'forwards' });
    await sleep(600);
    say('출구까지 조금만 더...', true);
    await travel;
    await sleep(450);

    say('떨어진다!');
    $('head').classList.add('open');
    slip.cancel();
    await doll.animate([
      { transform: `rotate(${r + 6}deg) translateY(10px)` },
      { transform: `rotate(${r + 40}deg) translateY(380px)` },
    ], { duration: 700 * T, easing: 'cubic-bezier(.5,0,1,.6)', fill: 'forwards' }).finished;

    markDrawn(slot);
    $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go');
    await sleep(120);
    busy = false;
    showReveal(slot, false);
  }

  function showPlay(i) {
    slot = i;
    $('pname').textContent = NAMES[i];
    buildMachine();
    show('play');
  }

  // ---------- 결과 ----------
  function showReveal(i, again) {
    const c = CHARS[ASSIGN[i]];
    const rv = $('reveal');
    rv.style.setProperty('--c', c.color);
    rv.style.setProperty('--c2', c.soft);
    $('bigDoll').innerHTML = dollSVG(c);
    $('rname').textContent = NAMES[i];
    $('rchar').textContent = c.name;
    $('rcolor').textContent = c.colorName;
    $('rnote').textContent = (again ? '이미 뽑은 결과예요. 다시 들어와도 그대로예요. ' : '') + `${c.colorName} ${c.name} 잠옷 입고 만나요! (${ddayText()})`;
    rv.querySelectorAll('.tada, .polaroid, .big-doll, .stamp').forEach((el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
    show('reveal');
    confetti(c.color);
  }

  // ---------- 색종이 ----------
  let confettiRun = 0;
  function confetti(main) {
    if (reduce) return;
    const cv = $('confetti');
    const ctx = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = [main, main, '#ff9fbf', '#ffd84d', '#9fdcff', '#ffffff', '#7fd062'];
    const parts = Array.from({ length: 140 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * 60,
      y: H * 0.35,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 14 - 4,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      a: Math.random() * Math.PI,
      va: (Math.random() - 0.5) * 0.4,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const id = ++confettiRun;
    const start = performance.now();
    function frame(now) {
      if (id !== confettiRun) return;
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.strokeStyle = '#4a2f27'; ctx.lineWidth = 1; ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (t < 3600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }

  // ---------- 연결 ----------
  $('grabBtn').addEventListener('click', play);
  $('backBtn').addEventListener('click', () => { if (!busy) { renderNames(); show('home'); } });
  $('homeBtn').addEventListener('click', () => { confettiRun++; renderNames(); show('home'); });

  renderNames();
})();
</script>
</body></html>
